<!doctype html>
<html lang="ko" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6fbff">
  <meta name="description" content="하치와레가 고민하다가 오늘 저녁 메뉴를 골라줘요. 꾹 눌러서 기다려 보세요!">
  <title>하치와레가 저녁 골라줄게!</title>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="먼작귀 저녁 추천">
  <meta property="og:title" content="하치와레가 저녁 골라줄게!">
  <meta property="og:description" content="오늘 저녁 뭐 먹지? 하치와레한테 맡겨 봐. 어떻게든 되겠지~!">
  <meta property="og:image" content="https://project-meonjakgui.vercel.app/assets/social/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="저녁 메뉴를 고민하는 하치와레">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="하치와레가 저녁 골라줄게!">
  <meta name="twitter:description" content="오늘 저녁 뭐 먹지? 하치와레한테 맡겨 봐.">
  <meta name="twitter:image" content="https://project-meonjakgui.vercel.app/assets/social/og.png">
  <link rel="icon" href="assets/effects/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 2c0 7-3 10-10 10 7 0 10 3 10 10 0-7 3-10 10-10-7 0-10-3-10-10Z"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M20.2 5.8c-2.3-2.4-6.1-1.8-8.2 1-2.1-2.8-5.9-3.4-8.2-1C.3 9.5 4.7 15.1 12 20c7.3-4.9 11.7-10.5 8.2-14.2Z"/></symbol>
    <symbol id="replay" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 .3 7M4 4v5h5"/></symbol>
    <symbol id="share" viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="fork" viewBox="0 0 24 24"><path d="M7 2v8a3 3 0 0 0 3 3v9M5 2v6m4-6v6M17 2c-2 0-3 3-3 7v4h3v9"/></symbol>
  </defs></svg>

  <main class="app" id="app" data-mode="pick" data-phase="idle" data-state="idle">
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow" id="eyebrow">오늘 저녁 뭐 먹지?</p>
      <h1 id="title">하치와레가<br>골라줄게<span class="accent">!</span></h1>
    </section>

    <div class="scene" id="scene">
      <div class="scene-glow"></div>
      <svg class="scene-star star-one"><use href="#star"/></svg>
      <svg class="scene-star star-two"><use href="#star"/></svg>
      <div class="speech" id="speech" aria-hidden="true">
        <svg class="speech-outline" viewBox="0 0 160 100" preserveAspectRatio="none">
          <path class="speech-contour" d="M28 12C8 20 6 39 14 54C19 64 28 70 40 72L31 91Q48 85 59 75C89 80 133 76 146 58C160 39 150 19 130 11C102 0 53 2 28 12Z"/>
          <path class="speech-fluster" d="M143 5l4-4m5 11 6-2"/>
        </svg>
        <span id="speechText">뭐 먹지…?</span>
      </div>
      <div class="ground" aria-hidden="true"></div>

      <button class="character-button" id="characterButton" type="button" aria-label="꾹 눌러서 하치와레한테 고민시키기">
        <!-- 직접 그린 하치와레. 이미지로 교체하려면 js/app.js 의 CONFIG.useImages 를 참고. -->
        <svg class="character" id="character" viewBox="0 0 320 340" role="img" aria-labelledby="characterTitle">
          <title id="characterTitle">하치와레</title>
          <defs>
            <clipPath id="headClip"><path d="M60 150C60 85 105 32 160 32C215 32 260 85 260 150C260 190 250 215 235 232C255 260 258 300 230 318C190 330 130 330 90 318C62 300 65 260 85 232C70 215 60 190 60 150Z"/></clipPath>
          </defs>
          <g class="c-root">
            <g class="c-tail">
              <path d="M234 284c36-6 54-32 40-62" fill="none" stroke="#4a3a35" stroke-width="18" stroke-linecap="round"/>
              <path d="M234 284c36-6 54-32 40-62" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
              <circle cx="274" cy="222" r="9" fill="#8dbce8" stroke="#4a3a35" stroke-width="3.5"/>
            </g>
            <ellipse class="c-foot" cx="130" cy="326" rx="17" ry="9" fill="#fff" stroke="#4a3a35" stroke-width="4"/>
            <ellipse class="c-foot" cx="190" cy="326" rx="17" ry="9" fill="#fff" stroke="#4a3a35" stroke-width="4"/>
            <path class="c-ear c-ear-l" d="M66 132C40 90 48 42 72 20C98 26 122 44 138 66Z" fill="#8dbce8" stroke="#4a3a35" stroke-width="4" stroke-linejoin="round"/>
            <path class="c-ear c-ear-r" d="M254 132C280 90 272 42 248 20C222 26 198 44 182 66Z" fill="#8dbce8" stroke="#4a3a35" stroke-width="4" stroke-linejoin="round"/>
            <path class="c-body" d="M60 150C60 85 105 32 160 32C215 32 260 85 260 150C260 190 250 215 235 232C255 260 258 300 230 318C190 330 130 330 90 318C62 300 65 260 85 232C70 215 60 190 60 150Z" fill="#fff" stroke="#4a3a35" stroke-width="4" stroke-linejoin="round"/>
            <g clip-path="url(#headClip)">
              <path d="M151 18C132 62 104 102 60 140L10 140L10-10L151-10Z" fill="#8dbce8" stroke="#4a3a35" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M169 18C188 62 216 102 260 140L310 140L310-10L169-10Z" fill="#8dbce8" stroke="#4a3a35" stroke-width="3.5" stroke-linejoin="round"/>
            </g>
            <g class="c-arm c-arm-l"><ellipse cx="63" cy="262" rx="19" ry="11" transform="rotate(-18 63 262)" fill="#fff" stroke="#4a3a35" stroke-width="4"/></g>
            <g class="c-arm c-arm-r"><ellipse cx="257" cy="262" rx="19" ry="11" transform="rotate(18 257 262)" fill="#fff" stroke="#4a3a35" stroke-width="4"/></g>
            <g class="c-face">
              <ellipse class="c-blush" cx="104" cy="168" rx="13" ry="7" fill="#f6b4bf"/>
              <ellipse class="c-blush" cx="216" cy="168" rx="13" ry="7" fill="#f6b4bf"/>
              <path class="c-brow" d="M116 120q11-8 22 0" fill="none" stroke="#4a3a35" stroke-width="3" stroke-linecap="round"/>
              <path class="c-brow" d="M182 120q11-8 22 0" fill="none" stroke="#4a3a35" stroke-width="3" stroke-linecap="round"/>
              <g class="c-eyes">
                <circle cx="128" cy="150" r="9" fill="#2b2320"/><circle cx="131" cy="146" r="3" fill="#fff"/>
                <circle cx="192" cy="150" r="9" fill="#2b2320"/><circle cx="195" cy="146" r="3" fill="#fff"/>
              </g>
              <path class="c-mouth-closed" d="M146 170q7 9 14 0q7 9 14 0" fill="none" stroke="#4a3a35" stroke-width="3" stroke-linecap="round"/>
              <g class="c-mouth-open"><path d="M140 168c6 22 34 22 40 0Z" fill="#4a3a35"/><path d="M150 180c5 7 15 7 20 0c-4-5-16-5-20 0Z" fill="#f08a9b"/></g>
              <path class="c-sweat" d="M238 86c-9 13-9 22 0 22s9-9 0-22Z" fill="#a6d2f7" stroke="#4a3a35" stroke-width="2.5" stroke-linejoin="round"/>
            </g>
          </g>
        </svg>
        <img class="character-image" id="characterImage" alt="" hidden draggable="false">
      </button>
      <img class="shake-lines" src="assets/effects/shake-lines.svg" alt="" aria-hidden="true">

      <div class="burst-message" id="burstMessage" aria-hidden="true"><small>오늘 저녁은—!!</small><strong id="burstText"></strong></div>
      <div class="particles" id="particles" aria-hidden="true"></div>
    </div>

    <div class="scene-caption" id="sceneCaption"><span class="tiny-star"><svg><use href="#star"/></svg></span><span id="captionText">오늘 저녁… 뭐가 좋을까</span></div>

    <section class="result" id="result" aria-live="polite" hidden>
      <div class="result-card">
        <span class="result-emoji" id="resultEmoji"></span>
        <strong class="result-name" id="resultName"></strong>
        <span class="result-tag" id="resultTag"></span>
      </div>
      <p class="result-comment" id="resultComment"></p>
    </section>

    <section class="controls" id="controls" aria-label="메뉴 고르기">
      <div class="chips" id="chips" role="radiogroup" aria-label="메뉴 종류">
        <button type="button" class="chip" role="radio" aria-checked="true" data-cat="all">전체</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="ko">한식</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="cn">중식</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="jp">일식</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="west">양식</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="asia">아시안</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="snack">분식·야식</button>
        <button type="button" class="chip" role="radio" aria-checked="false" data-cat="light">가볍게</button>
      </div>
      <div class="meter-meta"><span id="meterLabel">고민</span><span><strong id="percent">0</strong><span class="percent-mark">%</span></span></div>
      <div class="meter" id="meter" role="progressbar" aria-label="하치와레의 고민" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="meter-fill" id="meterFill"></div><svg class="meter-star" id="meterStar"><use href="#star"/></svg></div>
      <button class="hold-button" id="holdButton" type="button"><svg class="icon"><use href="#fork"/></svg><span id="buttonLabel">꾹 눌러서 골라달라고 하기</span><span class="hold-dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
      <div class="result-actions" id="resultActions" hidden>
        <button class="replay-button" id="replayButton" type="button"><svg class="icon"><use href="#replay"/></svg>다른 거 골라줘…!</button>
        <div class="share-row">
          <button class="outline-button" id="shareButton" type="button"><svg class="icon"><use href="#share"/></svg>친구한테 알려주기</button>
          <button class="outline-button" id="copyButton" type="button">링크 복사</button>
        </div>
        <p class="link-status" id="linkStatus" role="status" aria-live="polite"></p>
      </div>
      <button class="action-button" id="tryButton" type="button" hidden><svg class="icon"><use href="#fork"/></svg>나도 골라달라고 하기</button>
    </section>

    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true">꾹 눌러서 하치와레에게 저녁 메뉴를 골라달라고 하세요.</p>
    <footer class="credit">팬 메이드 · 치이카와 © nagano</footer>
  </main>
  <script src="js/menus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
